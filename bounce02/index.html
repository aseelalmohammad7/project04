<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Language Switcher</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <nav>

            <h1 id="title">
                My Portfolio
            </h1>

            <button id="languageButton" type="button">
                العربية
            </button>

        </nav>

    </header>


    <main>

        <section>

            <h2 id="welcome">
                Welcome to my portfolio
            </h2>

            <p id="description">
                This is my personal portfolio website.
            </p>

        </section>


        <section>

            <h2 id="skillsTitle">
                My Skills
            </h2>

            <p id="skillsText">
                HTML, CSS, JavaScript and Git.
            </p>

        </section>


        <section>

            <h2 id="contactTitle">
                Contact Me
            </h2>

            <p id="contactText">
                Feel free to contact me.
            </p>

        </section>

    </main>


    <footer>

        <p id="footerText">
            All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
