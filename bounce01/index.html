<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Photo Switcher</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="photo-switcher">

        <h1>Profile Photo Switcher</h1>

        <img
            id="profileImage"
            src="assets/profile1.jpg"
            alt="Profile photo - casual"
        >

        <div class="buttons">

            <button id="casualButton" type="button">
                Casual
            </button>

            <button id="professionalButton" type="button">
                Professional
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
